name: Build Configurator
# Don't enable CI on push, just on PR. If you
# are working on the main repo and want to trigger
# a CI build submit a draft PR. Signed tagged builds
# are produced by .github/workflows/release.yml.
on: 
  pull_request:

  workflow_call:
    inputs:
      require_signing:
        description: 'Fail macOS jobs unless signing and notarization credentials are complete'
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

jobs:
    save-pr-number:
        runs-on: ubuntu-latest
        # Only needed for pull_request events; workflow_call (release builds) skips this.
        if: github.event_name == 'pull_request'
        steps:
            - name: Save PR number
              run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
            - name: Upload PR number artifact
              uses: actions/upload-artifact@v4
              with:
                name: pr-number
                path: pr_number.txt

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Setup environment
              env:
                ACTIONS_ALLOW_UNSECURE_COMMANDS: true
              run: |
                # This is the hash of the commit for the PR
                # when the action is triggered by PR, empty otherwise
                COMMIT_ID=${{ github.event.pull_request.head.sha }}
                # This is the hash of the commit when triggered by push
                # but the hash of refs/pull/<n>/merge, which is different
                # from the hash of the latest commit in the PR, that's
                # why we try github.event.pull_request.head.sha first
                COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
                BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
                VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
                echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
                echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
                echo "BUILD_NAME=inav-configurator_linux_x64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                #check-latest: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get -y install dpkg fakeroot rpm build-essential libudev-dev
            - name: Install deps
              uses: nick-fields/retry@v3
              with:
                max_attempts: 3
                retry_on: error
                command: yarn install
                timeout_minutes: 10
                on_retry_command: rm -rfv node_modules
            - name: Build Linux
              run: yarn run make
            - name: Upload Linux deb
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_DEB
                path: ./out/make/deb/x64/*.deb
            - name: Upload Linux rpm
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_RPM
                path: ./out/make/rpm/x64/*.rpm
            - name: Upload Linux zip
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_ZIP
                path: ./out/make/zip/linux/x64/*.zip

    build-linux-aarch64:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Setup environment
              env:
                ACTIONS_ALLOW_UNSECURE_COMMANDS: true
              run: |
                # This is the hash of the commit for the PR
                # when the action is triggered by PR, empty otherwise
                COMMIT_ID=${{ github.event.pull_request.head.sha }}
                # This is the hash of the commit when triggered by push
                # but the hash of refs/pull/<n>/merge, which is different
                # from the hash of the latest commit in the PR, that's
                # why we try github.event.pull_request.head.sha first
                COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
                BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
                VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
                echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
                echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
                echo "BUILD_NAME=inav-configurator_linux_aarch64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                #check-latest: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get -y install dpkg fakeroot rpm build-essential libudev-dev
            - name: Install deps
              uses: nick-fields/retry@v3
              with:
                max_attempts: 3
                retry_on: error
                command: yarn install
                timeout_minutes: 10
                on_retry_command: rm -rfv node_modules
            - name: Build Linux
              run: yarn run make -- --arch="arm64"
            - name: Upload Linux deb
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_DEB
                path: ./out/make/deb/arm64/*.deb
            - name: Upload Linux rpm
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_RPM
                path: ./out/make/rpm/arm64/*.rpm
            - name: Upload Linux zip
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_ZIP
                path: ./out/make/zip/linux/arm64/*.zip

    build-mac-arm64:
        runs-on: macos-15
        steps:
        - uses: actions/checkout@v4
        - name: Setup environment
          env:
            ACTIONS_ALLOW_UNSECURE_COMMANDS: true
          run: |
            # This is the hash of the commit for the PR
            # when the action is triggered by PR, empty otherwise
            COMMIT_ID=${{ github.event.pull_request.head.sha }}
            # This is the hash of the commit when triggered by push
            # but the hash of refs/pull/<n>/merge, which is different
            # from the hash of the latest commit in the PR, that's
            # why we try github.event.pull_request.head.sha first
            COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
            BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
            VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
            echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
            echo "BUILD_NAMEarm64=inav-configurator_MacOS_arm64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            #check-latest: true
        # Workaround due to a bug in node-gyp: https://github.com/electron/rebuild/issues/1116
        - name: Install Setuptools
          run: python3 -m pip install --break-system-packages setuptools
        - name: Install deps
          uses: nick-fields/retry@v3
          with:
            max_attempts: 3
            retry_on: error
            command: yarn install --foreground-scripts
            timeout_minutes: 10
            on_retry_command: rm -rfv node_modules
        # Signing credentials must never be imported on pull_request: yarn make
        # loads the checked-out forge.config.js. Same-repo PRs receive secrets.
        # Nightly and tagged releases (workflow_call) are the trusted signing path.
        # Official releases pass require_signing so missing secrets fail the job.
        - name: Import signing certificate
          if: github.event_name != 'pull_request'
          env:
            MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
            MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
            MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be signed; set MACOS_CERT_P12, MACOS_CERT_PASSWORD, and MACOS_SIGN_IDENTITY."
                exit 1
              fi
              echo "Incomplete signing secrets (need MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY); building unsigned."
              exit 0
            fi
            KEYCHAIN=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain
            rm $RUNNER_TEMP/cert.p12
            echo "OSX_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
        - name: Write notarization API key
          if: github.event_name != 'pull_request'
          env:
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be notarized; set APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER."
                exit 1
              fi
              echo "Incomplete notarization secrets; skipping notarization key."
              exit 0
            fi
            KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
            echo "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
        # Package (and notarize) separately from DMG/ZIP so a flaky hdiutil
        # detach does not redo Apple's notarization queue.
        - name: Package MacOS arm64
          env:
            NODE_OPTIONS: --max-old-space-size=4096
          run: |
            yarn run package -- --arch="arm64"
            test -d "out/INAV Configurator-darwin-arm64/INAV Configurator.app"
        - name: Make MacOS arm64 distributables
          uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
          with:
            max_attempts: 3
            retry_on: error
            timeout_minutes: 20
            command: |
              sudo mdutil -a -i off || true
              hdiutil detach "/Volumes/INAV-Configurator" -force 2>/dev/null || true
              yarn run make -- --arch="arm64" --skip-package
        - name: Verify signing and notarization
          if: github.event_name != 'pull_request'
          env:
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            APP="out/INAV Configurator-darwin-arm64/INAV Configurator.app"
            if [ -z "$OSX_SIGN_IDENTITY" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be signed."
                exit 1
              fi
              echo "Unsigned build; skipping signing verification."
              exit 0
            fi
            codesign --verify --deep --strict --verbose=2 "$APP"
            if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -f "$APPLE_API_KEY" ]; then
              xcrun stapler validate "$APP"
              spctl --assess --type execute -v "$APP"
            else
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be notarized."
                exit 1
              fi
              echo "Signed-only build; skipping notarization verification."
            fi
        - name: Upload MacOS arm64 zip
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEarm64}}_ZIP
            path: ./out/make/zip/darwin/arm64/*.zip
        - name: Upload MacOS arm64 dmg
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEarm64}}_DMG
            path: ./out/make/*arm64*.dmg

    build-mac:
        runs-on: macos-15-intel
        steps:
        - uses: actions/checkout@v4
        - name: Setup environment
          env:
            ACTIONS_ALLOW_UNSECURE_COMMANDS: true
          run: |
            # This is the hash of the commit for the PR
            # when the action is triggered by PR, empty otherwise
            COMMIT_ID=${{ github.event.pull_request.head.sha }}
            # This is the hash of the commit when triggered by push
            # but the hash of refs/pull/<n>/merge, which is different
            # from the hash of the latest commit in the PR, that's
            # why we try github.event.pull_request.head.sha first
            COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
            BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
            VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
            echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
            echo "BUILD_NAMEx64=inav-configurator_MacOS_x64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            #check-latest: true
        # Workaround due to a bug in node-gyp: https://github.com/electron/rebuild/issues/1116
        - name: Install Setuptools
          run: python3 -m pip install --break-system-packages setuptools
        - name: Install deps
          uses: nick-fields/retry@v3
          with:
            max_attempts: 3
            retry_on: error
            command: yarn install --foreground-scripts
            timeout_minutes: 10
            on_retry_command: rm -rfv node_modules
        # Signing credentials must never be imported on pull_request: yarn make
        # loads the checked-out forge.config.js. Same-repo PRs receive secrets.
        # Nightly and tagged releases (workflow_call) are the trusted signing path.
        # Official releases pass require_signing so missing secrets fail the job.
        - name: Import signing certificate
          if: github.event_name != 'pull_request'
          env:
            MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
            MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
            MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be signed; set MACOS_CERT_P12, MACOS_CERT_PASSWORD, and MACOS_SIGN_IDENTITY."
                exit 1
              fi
              echo "Incomplete signing secrets (need MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY); building unsigned."
              exit 0
            fi
            KEYCHAIN=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain
            rm $RUNNER_TEMP/cert.p12
            echo "OSX_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
        - name: Write notarization API key
          if: github.event_name != 'pull_request'
          env:
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be notarized; set APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER."
                exit 1
              fi
              echo "Incomplete notarization secrets; skipping notarization key."
              exit 0
            fi
            KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
            echo "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
        # Package (and notarize) separately from DMG/ZIP so a flaky hdiutil
        # detach does not redo Apple's notarization queue.
        - name: Package MacOS x64
          env:
            NODE_OPTIONS: --max-old-space-size=4096
          run: |
            yarn run package -- --arch="x64"
            test -d "out/INAV Configurator-darwin-x64/INAV Configurator.app"
        - name: Make MacOS x64 distributables
          uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
          with:
            max_attempts: 3
            retry_on: error
            timeout_minutes: 20
            command: |
              sudo mdutil -a -i off || true
              hdiutil detach "/Volumes/INAV-Configurator" -force 2>/dev/null || true
              yarn run make -- --arch="x64" --skip-package
        - name: Verify signing and notarization
          if: github.event_name != 'pull_request'
          env:
            REQUIRE_SIGNING: ${{ inputs.require_signing }}
          run: |
            APP="out/INAV Configurator-darwin-x64/INAV Configurator.app"
            if [ -z "$OSX_SIGN_IDENTITY" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::Official releases must be signed."
                exit 1
              fi
              echo "Unsigned build; skipping signing verification."
              exit 0
            fi
            codesign --verify --deep --strict --verbose=2 "$APP"
            if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -f "$APPLE_API_KEY" ]; then
              xcrun stapler validate "$APP"
              spctl --assess --type execute -v "$APP"
