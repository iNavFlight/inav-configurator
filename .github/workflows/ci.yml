            echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
            echo "BUILD_NAMEx64=inav-configurator_MacOS_x64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            #check-latest: true
        # Workaround due to a bug in node-gyp: https://github.com/electron/rebuild/issues/1116
        - name: Install Setuptools
          run: python3 -m pip install --break-system-packages setuptools
        - name: Install deps
          uses: nick-fields/retry@v3
          with:
            max_attempts: 3
            retry_on: error
            command: yarn install --foreground-scripts
            timeout_minutes: 10
            on_retry_command: rm -rfv node_modules
        # Signing/notarization steps only run when the repository has the
        # required secrets configured; fork PRs build unsigned as before.
        - name: Import signing certificate
          if: ${{ secrets.MACOS_CERT_P12 != '' }}
          env:
            MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
            MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          run: |
            KEYCHAIN=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain
            rm $RUNNER_TEMP/cert.p12
        - name: Write notarization API key
          if: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          env:
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          run: echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/apple_api_key.p8
        - name: Build MacOS x64
          env:
            NODE_OPTIONS: --max-old-space-size=4096
            OSX_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
            APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          run: yarn run make -- --arch="x64"
        - name: Verify signing and notarization
          if: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
          run: |
            xcrun stapler validate "out/INAV Configurator-darwin-x64/INAV Configurator.app"
            spctl --assess --type execute -v "out/INAV Configurator-darwin-x64/INAV Configurator.app"
        - name: Upload MacOS x64 zip
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEx64}}_ZIP
            path: ./out/make/zip/darwin/x64/*.zip
        - name: Upload MacOS x64 dmg
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEx64}}_DMG
            path: ./out/make/*x64*.dmg

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install linux utils
              run: choco install --force -y awk grep sed
            - name: Setup environment
              env:
                ACTIONS_ALLOW_UNSECURE_COMMANDS: true
              run: |
                # This is the hash of the commit for the PR
                # when the action is triggered by PR, empty otherwise
                COMMIT_ID=${{ github.event.pull_request.head.sha }}
                # This is the hash of the commit when triggered by push
                # but the hash of refs/pull/<n>/merge, which is different
                # from the hash of the latest commit in the PR, that's
                # why we try github.event.pull_request.head.sha first
                COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
                BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
                VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
                echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
                echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
                echo "BUILD_NAMEx64=inav-configurator_Windows64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
              shell: bash
            - uses: actions/setup-node@v4
              with:
                node-version: 22
            - uses: engineerd/configurator@v0.0.10
              with: 
                name: "Wix Toolset 3.1.4"
                url: "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
                pathInArchive: "/"
            - name: Install deps
              uses: nick-fields/retry@v3
              with:
                max_attempts: 3
                retry_on: error
                command: yarn install --foreground-scripts
                timeout_minutes: 10
                on_retry_command: rm -rfv node_modules
            - name: Build Win x64
              run: yarn run make -- --arch="x64"
            - name: Upload Windows x64 zip
              uses: actions/upload-artifact@v4
              with:
                name: ${{env.BUILD_NAMEx64}}_ZIP
                path: ./out/make/zip/win32/x64/*.zip
            - name: Upload Windows x64 msi
              uses: actions/upload-artifact@v4
              with:
                name: ${{env.BUILD_NAMEx64}}_MSI
                path: ./out/make/wix/x64/*.msi

