<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INAV Web Serial MSP PoC</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
        }

        body {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #111827;
            color: #e5e7eb;
        }

        h1 {
            margin-bottom: .25rem;
        }

        .note,
        #status {
            color: #a5b4fc;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
            margin: 1.25rem 0;
        }

        button,
        select {
            font: inherit;
            padding: .55rem .8rem;
            border-radius: .4rem;
            border: 1px solid #475569;
            background: #1e293b;
            color: inherit;
        }

        button:enabled {
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #log {
            min-height: 28rem;
            max-height: 65vh;
            overflow: auto;
            margin: 0;
            padding: 1rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid #334155;
            border-radius: .5rem;
            background: #020617;
            color: #d1fae5;
            font: .85rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .warning {
            color: #fbbf24;
        }
    </style>
</head>

<body>
    <h1>INAV Web Serial MSP proof of concept</h1>
    <p class="note">Open from a secure context (HTTPS or <code>localhost</code>). Choose the flight-controller serial
        port, then send the four MSP identification/status requests.</p>
    <p id="status" role="status">Checking Web Serial support…</p>
    <div class="controls">
        <label>Request framing
            <select id="protocol" aria-label="MSP request framing">
                <option value="v1" selected>MSP v1 (recommended for these commands)</option>
                <option value="v2">MSP v2</option>
            </select>
        </label>
        <button id="connect">Choose port and connect at 115200</button>
        <button id="send" disabled>Send API / variant / version / status</button>
        <button id="disconnect" disabled>Disconnect</button>
        <button id="clear">Clear log</button>
    </div>
    <pre id="log" aria-live="polite"></pre>

    <script>
        'use strict';

        // MSP command identifiers used by this PoC.
        const MSP_API_VERSION = 1;
        const MSP_FC_VARIANT = 2;
        const MSP_FC_VERSION = 3;
        const MSP_STATUS = 101;
        const COMMAND_NAMES = new Map([
            [MSP_API_VERSION, 'MSP_API_VERSION'],
            [MSP_FC_VARIANT, 'MSP_FC_VARIANT'],
            [MSP_FC_VERSION, 'MSP_FC_VERSION'],
            [MSP_STATUS, 'MSP_STATUS'],
        ]);

        const connectButton = document.querySelector('#connect');
        const sendButton = document.querySelector('#send');
        const disconnectButton = document.querySelector('#disconnect');
        const clearButton = document.querySelector('#clear');
        const protocolSelect = document.querySelector('#protocol');
        const statusElement = document.querySelector('#status');
        const logElement = document.querySelector('#log');

        let port = null;
        let readLoopActive = false;
        let receiveBuffer = new Uint8Array(0);

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function hex(bytes) {
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        }

        function setConnected(connected) {
            connectButton.disabled = connected;
            sendButton.disabled = !connected;
            disconnectButton.disabled = !connected;
            protocolSelect.disabled = connected;
            statusElement.textContent = connected ? 'Connected at 115200 baud. Receiving MSP frames…' : 'Not connected.';
        }

        function appendBytes(left, right) {
            const combined = new Uint8Array(left.length + right.length);
            combined.set(left);
            combined.set(right, left.length);
            return combined;
        }

        function xorChecksum(bytes) {
            return bytes.reduce((checksum, byte) => checksum ^ byte, 0);
        }

        // CRC-8/DVB-S2: the checksum used by MSP v2.
        function crc8DvbS2(bytes) {
            let crc = 0;
            for (const byte of bytes) {
                crc ^= byte;
                for (let bit = 0; bit < 8; bit += 1) {
                    crc = (crc & 0x80) ? ((crc << 1) ^ 0xD5) & 0xFF : (crc << 1) & 0xFF;
                }
            }
            return crc;
        }

        // $M< size command payload checksum. MSP v1 command IDs are one byte.
        function encodeMspV1Request(command, payload = new Uint8Array(0)) {
            if (command > 0xFF) throw new Error('MSP v1 supports command IDs up to 255.');
            if (payload.length > 0xFF) throw new Error('MSP v1 payload is limited to 255 bytes.');
            const frame = new Uint8Array(6 + payload.length);
            frame.set([0x24, 0x4D, 0x3C, payload.length, command]); // "$M<"
            frame.set(payload, 5);
            frame[frame.length - 1] = xorChecksum(frame.slice(3, -1));
            return frame;
        }

        // $X< flags functionLE payloadLengthLE payload CRC-8/DVB-S2.
        function encodeMspV2Request(command, payload = new Uint8Array(0), flags = 0) {
            if (payload.length > 0xFFFF) throw new Error('MSP v2 payload is limited to 65535 bytes.');
            const frame = new Uint8Array(9 + payload.length);
            frame.set([0x24, 0x58, 0x3C, flags, command & 0xFF, command >> 8, payload.length & 0xFF, payload.length >> 8]); // "$X<"
            frame.set(payload, 8);
            frame[frame.length - 1] = crc8DvbS2(frame.slice(3, -1));
            return frame;
        }

        function parseReceiveBuffer() {
            // A read can begin/end anywhere in a frame. Keep incomplete bytes in receiveBuffer.
            while (receiveBuffer.length >= 3) {
                const start = receiveBuffer.indexOf(0x24); // '$'
                if (start === -1) {
                    log(`RX discarded non-MSP bytes: ${hex(receiveBuffer)}`);
                    receiveBuffer = new Uint8Array(0);
                    return;
                }
                if (start > 0) {
                    log(`RX discarded leading bytes: ${hex(receiveBuffer.slice(0, start))}`);
                    receiveBuffer = receiveBuffer.slice(start);
                    if (receiveBuffer.length < 3) return;
                }

                const protocol = receiveBuffer[1];
                if (protocol !== 0x4D && protocol !== 0x58) { // M or X
                    receiveBuffer = receiveBuffer.slice(1);
                    continue;
                }
                const direction = receiveBuffer[2];
                if (![0x3C, 0x3E, 0x21].includes(direction)) { // <, >, !
                    receiveBuffer = receiveBuffer.slice(1);
                    continue;
                }

                if (protocol === 0x4D) {
                    if (receiveBuffer.length < 6) return;
                    const payloadLength = receiveBuffer[3];
                    const frameLength = 6 + payloadLength;
                    if (receiveBuffer.length < frameLength) return;
                    const frame = receiveBuffer.slice(0, frameLength);
                    receiveBuffer = receiveBuffer.slice(frameLength);
                    const valid = xorChecksum(frame.slice(3, -1)) === frame[frameLength - 1];
                    handleMspFrame({ version: 1, direction, command: frame[4], payload: frame.slice(5, -1), valid, raw: frame });
                } else {
                    if (receiveBuffer.length < 9) return;
                    const payloadLength = receiveBuffer[6] | (receiveBuffer[7] << 8);
                    const frameLength = 9 + payloadLength;
                    if (receiveBuffer.length < frameLength) return;
                    const frame = receiveBuffer.slice(0, frameLength);
                    receiveBuffer = receiveBuffer.slice(frameLength);
                    const valid = crc8DvbS2(frame.slice(3, -1)) === frame[frameLength - 1];
                    handleMspFrame({
                        version: 2,
                        direction,
                        flags: frame[3],
                        command: frame[4] | (frame[5] << 8),
                        payload: frame.slice(8, -1),
                        valid,
                        raw: frame,
                    });
                }
            }
        }

        function readU16(payload, offset) {
            return offset + 1 < payload.length ? payload[offset] | (payload[offset + 1] << 8) : undefined;
        }

        function readU32(payload, offset) {
            return offset + 3 < payload.length
                ? (payload[offset] | (payload[offset + 1] << 8) | (payload[offset + 2] << 16) | (payload[offset + 3] << 24)) >>> 0
                : undefined;
        }

        function decodePayload(command, payload) {
            switch (command) {
                case MSP_API_VERSION:
                    return payload.length >= 3
                        ? `protocol=${payload[0]}, API=${payload[1]}.${payload[2]}`
                        : 'truncated API-version response';
                case MSP_FC_VARIANT:
                    return `variant="${new TextDecoder().decode(payload).replace(/\0/g, '')}"`;
                case MSP_FC_VERSION:
                    return payload.length >= 3
                        ? `firmware=${payload[0]}.${payload[1]}.${payload[2]}`
                        : 'truncated FC-version response';
                case MSP_STATUS: {
                    const cycleTime = readU16(payload, 0);
                    const i2cErrors = readU16(payload, 2);
                    const sensors = readU16(payload, 4);
                    const modeFlags = readU32(payload, 6);
                    const profile = payload.length > 10 ? payload[10] : undefined;
                    const values = [
                        `cycleTime=${cycleTime ?? 'n/a'}µs`,
                        `i2cErrors=${i2cErrors ?? 'n/a'}`,
                        `sensors=0x${(sensors ?? 0).toString(16).padStart(4, '0')}`,
                        `modeFlags=0x${(modeFlags ?? 0).toString(16).padStart(8, '0')}`,
                        `profile=${profile ?? 'n/a'}`,
                    ];
                    return values.join(', ');
                }
                default:
                    return `payload=${hex(payload) || '(empty)'}`;
            }
        }

        function handleMspFrame(frame) {
            const direction = String.fromCharCode(frame.direction);
            const name = COMMAND_NAMES.get(frame.command) || `MSP_${frame.command}`;
            const checksum = frame.valid ? 'checksum valid' : 'CHECKSUM INVALID';
            log(`RX MSP v${frame.version}${direction} ${name} (${frame.command}), ${checksum}: ${hex(frame.raw)}`);
            if (frame.valid) log(`   decoded: ${decodePayload(frame.command, frame.payload)}`);
        }

        async function readSerial() {
            try {
                while (port && port.readable && readLoopActive) {
                    const reader = port.readable.getReader();
                    try {
                        while (readLoopActive) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            if (value?.length) {
                                log(`RX chunk (${value.length} bytes): ${hex(value)}`);
                                receiveBuffer = appendBytes(receiveBuffer, value);
                                parseReceiveBuffer();
                            }
                        }
                    } finally {
                        reader.releaseLock();
                    }
                }
            } catch (error) {
                if (readLoopActive) log(`Serial read error: ${error.message}`);
            }
        }

        async function sendRequest(command) {
            if (!port?.writable) throw new Error('Serial port is not writable.');
            const frame = protocolSelect.value === 'v2'
                ? encodeMspV2Request(command)
                : encodeMspV1Request(command);
            const writer = port.writable.getWriter();
            try {
                await writer.write(frame);
                log(`TX MSP v${protocolSelect.value === 'v2' ? 2 : 1}< ${COMMAND_NAMES.get(command)} (${command}): ${hex(frame)}`);
            } finally {
                writer.releaseLock();
            }
        }

        async function disconnect() {
            readLoopActive = false;
            if (port) {
                try {
                    await port.close();
                    log('Serial port closed.');
                } catch (error) {
                    log(`Serial close error: ${error.message}`);
                }
            }
            port = null;
            receiveBuffer = new Uint8Array(0);
            setConnected(false);
        }

        connectButton.addEventListener('click', async () => {
            try {
                // requestPort must be called in direct response to a user gesture.
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                receiveBuffer = new Uint8Array(0);
                readLoopActive = true;
                setConnected(true);
                log('Serial port selected and opened at 115200 baud.');
                void readSerial();
            } catch (error) {
                log(`Unable to open serial port: ${error.message}`);
                port = null;
                setConnected(false);
            }
        });

        sendButton.addEventListener('click', async () => {
            try {
                for (const command of [MSP_API_VERSION, MSP_FC_VARIANT, MSP_FC_VERSION, MSP_STATUS]) {
                    await sendRequest(command);
                }
            } catch (error) {
                log(`Serial write error: ${error.message}`);
            }
        });

        disconnectButton.addEventListener('click', () => { void disconnect(); });
        clearButton.addEventListener('click', () => { logElement.textContent = ''; });

        if (!('serial' in navigator)) {
            statusElement.innerHTML = '<span class="warning">Web Serial is unavailable in this browser. Use a Chromium-based browser with Web Serial enabled, served from HTTPS or localhost.</span>';
            connectButton.disabled = true;
            log('Web Serial API is not available.');
        } else {
            statusElement.textContent = 'Web Serial is available. Choose a port to begin.';
            log('Web Serial API detected. MSP v1 and v2 encoders plus incremental response parsers are ready.');
        }
    </script>
</body>

</html>
