name: Build Configurator
# Don't enable CI on push, just on PR. If you
# are working on the main repo and want to trigger
# a CI build submit a draft PR.
on: 
  pull_request:

  workflow_call:
    #inputs:
    #  release_build:
    #   description: 'Specifies if it is a build that should include commit hash in hex file names or not'
    #   default: false
    #   required: false
    #   type: boolean

jobs:
    save-pr-number:
        runs-on: ubuntu-latest
        # Only needed for pull_request events; workflow_call (release builds) skips this.
        if: github.event_name == 'pull_request'
        steps:
            - name: Save PR number
              run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
            - name: Upload PR number artifact
              uses: actions/upload-artifact@v4
              with:
                name: pr-number
                path: pr_number.txt

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Setup environment
              env:
                ACTIONS_ALLOW_UNSECURE_COMMANDS: true
              run: |
                # This is the hash of the commit for the PR
                # when the action is triggered by PR, empty otherwise
                COMMIT_ID=${{ github.event.pull_request.head.sha }}
                # This is the hash of the commit when triggered by push
                # but the hash of refs/pull/<n>/merge, which is different
                # from the hash of the latest commit in the PR, that's
                # why we try github.event.pull_request.head.sha first
                COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
                BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
                VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
                echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
                echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
                echo "BUILD_NAME=inav-configurator_linux_x64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                #check-latest: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get -y install dpkg fakeroot rpm build-essential libudev-dev
            - name: Install deps
              uses: nick-fields/retry@v3
              with:
                max_attempts: 3
                retry_on: error
                command: yarn install
                timeout_minutes: 10
                on_retry_command: rm -rfv node_modules
            - name: Build Linux
              run: yarn run make
            - name: Upload Linux deb
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_DEB
                path: ./out/make/deb/x64/*.deb
            - name: Upload Linux rpm
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_RPM
                path: ./out/make/rpm/x64/*.rpm
            - name: Upload Linux zip
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_ZIP
                path: ./out/make/zip/linux/x64/*.zip

    build-linux-aarch64:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Setup environment
              env:
                ACTIONS_ALLOW_UNSECURE_COMMANDS: true
              run: |
                # This is the hash of the commit for the PR
                # when the action is triggered by PR, empty otherwise
                COMMIT_ID=${{ github.event.pull_request.head.sha }}
                # This is the hash of the commit when triggered by push
                # but the hash of refs/pull/<n>/merge, which is different
                # from the hash of the latest commit in the PR, that's
                # why we try github.event.pull_request.head.sha first
                COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
                BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
                VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
                echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
                echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
                echo "BUILD_NAME=inav-configurator_linux_aarch64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                #check-latest: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get -y install dpkg fakeroot rpm build-essential libudev-dev
            - name: Install deps
              uses: nick-fields/retry@v3
              with:
                max_attempts: 3
                retry_on: error
                command: yarn install
                timeout_minutes: 10
                on_retry_command: rm -rfv node_modules
            - name: Build Linux
              run: yarn run make -- --arch="arm64"
            - name: Upload Linux deb
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_DEB
                path: ./out/make/deb/arm64/*.deb
            - name: Upload Linux rpm
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_RPM
                path: ./out/make/rpm/arm64/*.rpm
            - name: Upload Linux zip
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.BUILD_NAME }}_ZIP
                path: ./out/make/zip/linux/arm64/*.zip

    build-mac-arm64:
        runs-on: macos-15
        steps:
        - uses: actions/checkout@v4
        - name: Setup environment
          env:
            ACTIONS_ALLOW_UNSECURE_COMMANDS: true
          run: |
            # This is the hash of the commit for the PR
            # when the action is triggered by PR, empty otherwise
            COMMIT_ID=${{ github.event.pull_request.head.sha }}
            # This is the hash of the commit when triggered by push
            # but the hash of refs/pull/<n>/merge, which is different
            # from the hash of the latest commit in the PR, that's
            # why we try github.event.pull_request.head.sha first
            COMMIT_ID=${COMMIT_ID:-${{ github.sha }}}
            BUILD_SUFFIX=ci-$(date '+%Y%m%d')-$(git rev-parse --short ${COMMIT_ID})
            VERSION=$(grep version package.json | sed 's/.*"\([0-9][0-9]*.[0-9]*.[0-9]*\)".*/\1/g')
            echo "BUILD_SUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
            echo "BUILD_NAMEarm64=inav-configurator_MacOS_arm64_${VERSION}_${BUILD_SUFFIX}" >> $GITHUB_ENV
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            #check-latest: true
        # Workaround due to a bug in node-gyp: https://github.com/electron/rebuild/issues/1116
        - name: Install Setuptools
          run: python3 -m pip install --break-system-packages setuptools
        - name: Install deps
          uses: nick-fields/retry@v3
          with:
            max_attempts: 3
            retry_on: error
            command: yarn install --foreground-scripts
            timeout_minutes: 10
            on_retry_command: rm -rfv node_modules
        # Signing/notarization steps only run when the repository has the
        # required secrets configured; fork PRs build unsigned as before.
        - name: Import signing certificate
          if: ${{ secrets.MACOS_CERT_P12 != '' }}
          env:
            MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
            MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          run: |
            KEYCHAIN=$RUNNER_TEMP/build.keychain-db
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain
            rm $RUNNER_TEMP/cert.p12
        - name: Write notarization API key
          if: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          env:
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          run: echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/apple_api_key.p8
        - name: Build MacOS arm64
          env:
            OSX_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
            APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          run: yarn run make -- --arch="arm64"
        - name: Verify signing and notarization
          if: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
          run: |
            xcrun stapler validate "out/INAV Configurator-darwin-arm64/INAV Configurator.app"
            spctl --assess --type execute -v "out/INAV Configurator-darwin-arm64/INAV Configurator.app"
        - name: Upload MacOS arm64 zip
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEarm64}}_ZIP
            path: ./out/make/zip/darwin/arm64/*.zip
        - name: Upload MacOS arm64 dmg
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.BUILD_NAMEarm64}}_DMG
            path: ./out/make/*arm64*.dmg

    build-mac:
        runs-on: macos-15-intel
        steps:
        - uses: actions/checkout@v4
        - name: Setup environment
          env:
            ACTIONS_ALLOW_UNSECURE_COMMANDS: true
          run: |
            # This is the hash of the commit for the PR
            # when the action is triggered by PR, empty otherwise
            COMMIT_ID=${{ github.event.pull_request.head.sha }}
            # This is the hash of the commit when triggered by push
            # but the hash of refs/pull/<n>/merge, which is different
